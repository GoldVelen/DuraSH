# SDK composition for the Host-owned reliability handoff snapshot.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: reliability-loop
      name: '@durash/dsh-reliability-loop'

    - id: reliability-policy
      name: '@durash/dsh-reliability-policy'

    - id: tool-reliability
      name: '@durash/dsh-tool-reliability'

    - id: snapshot-enable-reliability
      name: '../../../packages/reliability/durash-reliability-policy/tests/fixtures/snapshot-enable-tool.ts'
